# Research content
research:
  section_title: Selected Research
  items:
  - date: 2026 – Present
    title: Energy-Aware RTL Optimization with Agentic EDA
    subtitle: Argonne National Laboratory · Software-Hardware Co-Design
    summary: Building an agent-driven RTL optimization framework that iterates through synthesis,
      functional verification, and power-performance-area evaluation to explore energy-efficient
      hardware designs while preserving correctness.
    topics:
    - RTL
    - EDA Agents
    - PPA Evaluation
    - Functional Verification
  - date: 2026 – Present
    title: Energy Demand Prediction for BIA
    subtitle: Argonne National Laboratory · Co-Design Evaluation
    summary: Developing energy-demand prediction and evaluation methods for the BIA research project,
      connecting energy modeling with software-hardware co-design decisions.
    topics:
    - Energy Forecasting
    - Co-Design
    - Evaluation
  - date: '2026'
    title: 'QIAO-Bench: Predictive World Models for Long-Horizon Agents'
    subtitle: WM@Booth Workshop · Poster
    summary: A JEPA-based state-action benchmark for long-horizon agent decisions and recovery planning.
      The evaluation reached 93.8% recovery-state correctness and 100% rollback correctness in the
      recovery setting described in my research CV.
    topics:
    - Agentic AI
    - Benchmarking
    - Trajectory Analysis
    - World Models
    - Prediction
    paper_url: https://github.com/belsguidetotech/QIAO-Bench/blob/main/QIAO-Bench.pdf
    code_url: https://github.com/belsguidetotech/QIAO-Bench
  - date: 2026 – Present
    title: Long-Horizon Agent Evaluation & Data Infrastructure
    subtitle: University of Chicago · Chicago Human + AI Lab
    summary: Building data, annotation, trajectory-analysis, evaluation, and context infrastructure for
      long-horizon research agents, with a focus on understanding where decisions change the course of an
      agent run and how errors propagate over time.
    topics:
    - Agent Evaluation
    - Trajectory Data
    - Data Infrastructure
    - Human-in-the-Loop
  - date: 2026 – Present
    title: RecoverFlow
    subtitle: Failure Detection & Recovery for Long-Horizon Agents
    summary: Studies how failures emerge and propagate across agent trajectories, with the goal of detecting
      critical failure points early and selecting recovery actions before downstream errors compound.
    topics:
    - Agent Safety
    - Failure Detection
    - Recovery
    - Monitoring
  - date: 2026 – Present
    title: TraceGuard
    subtitle: Provenance-Aware Agent Safety Evaluation · UChicago DSI
    summary: Analyzes agent trajectories to localize unsafe transitions, trace their provenance,
      and evaluate interventions. Increased verified attack discovery from 60% to 100% at a matched
      search budget in the reported evaluation.
    topics:
    - AI Safety
    - Trajectory Analysis
    - Red-Teaming
    - Intervention
  - date: '2024'
    title: Explainable AI for Energy Forecasting
    subtitle: EIECT 2024
    summary: Built energy-consumption forecasting models with SHAP explanations to improve reliability,
      interpretability, and governance.
    topics:
    - Forecasting
    - Explainable AI
    - Energy
  - date: '2023'
    title: Medical Image Classification & Interpretability
    subtitle: NTU Business AI Lab
    summary: Developed CNN-based breast-cancer detection and interpretability dashboards, including data
      augmentation and model-analysis workflows.
    topics:
    - Computer Vision
    - Medical AI
    - Interpretability

# Events content
events:
  section_title: Learn & Connect
  intro: I learn through research workshops, developer communities, and conversations with people building
    AI systems in practice. I use these experiences to sharpen the questions I work on across agentic AI,
    benchmarking, safety, and ML systems.
  items:
  - date: Sep 2026
    event: WM@Booth (Poster Presenter · QIAO-Bench)
    location: Chicago Booth
    takeaway: Exploring when predictive representations of long-horizon trajectories become useful world
      models for planning, monitoring, and control.
    impact: Using the workshop to refine the path from one-step prediction toward multi-step prediction,
      counterfactual reasoning, recovery, and closed-loop agent control.
  - date: Aug 2026
    event: Agentic AI Summit
    location: UC Berkeley
    takeaway: 'Long-horizon agents need more than capability: evaluation, observability, reliability, and
      safety become increasingly important as agents move into real workflows.'
    impact: Strengthened my focus on trajectory analysis, benchmarking, failure detection, recovery, and
      intervention.
  - date: '2026'
    event: NVIDIA GTC
    location: San Jose
    takeaway: 'Agentic AI is the new operating system. Model capability increasingly depends on the systems underneath it: GPUs, efficient inference,
      distributed infrastructure, and reliable data pipelines.'
    impact: Deepened my interest in GPU-aware ML infrastructure, high-performance computing, efficient serving,
      and scalable ML systems.

